apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-api
  namespace: argocd
spec:
  project: default

  #source and path of helm chart
  source: 
    repoURL: https://github.com/Vatcharadze/kubernetes-devops-platform.git
    targetRevision: HEAD
    path: helm/devops-api
  
  destination:
    server: https://kubernetes.default.svc
    namespace: devops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true