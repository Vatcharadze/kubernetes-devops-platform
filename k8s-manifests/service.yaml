apiVersion: v1
kind: Service
metadata:
  name: devops-api-service
  namespace: devops
spec:
  selector:
    app: devops-api        # Must perfectly match the deployment template labels
  ports:
    - protocol: TCP
      port: 5000                # The port the service will expose to the cluster/world
      targetPort: 5000       # Must perfectly match the containerPort in your deployment
  type: ClusterIP           # NodePort makes it accessible on your machine's local IP address
