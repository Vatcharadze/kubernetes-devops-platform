apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-api
  namespace: devops 
  labels:
    app: devops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-api
  template:
    metadata:
      labels:
        app: devops-api
    spec:
      containers:
      - name: devops-api
        image: docker.io/vatcharadze/devops-api:1.0.0

        ports:
        - containerPort: 5000

        envFrom:
        - configMapRef:
            name: devops-api-config

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

      imagePullSecrets:
      - name: dockerhub-secret-devops   
