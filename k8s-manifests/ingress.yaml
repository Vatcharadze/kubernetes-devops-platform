apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-api-ingress
  namespace: devops   # Change if your app is in another namespace
spec:
  ingressClassName: nginx

  rules:
    - host: devops.api # Or your domain name
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-api-service
                port:
                  number: 5000
