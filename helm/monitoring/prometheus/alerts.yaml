apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: kubernetes-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: kubernetes-alerts
      rules:

       
        - alert: PodCrashLooping
          expr: |
            kube_pod_container_status_waiting_reason{
              reason="CrashLoopBackOff"
            } == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod is crash looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff state."

        
        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas
            >
            kube_deployment_status_replicas_available
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment has unavailable replicas"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired."

        
        - alert: HighCPUUsage
          expr: |
            1 - avg by (instance) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            ) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage detected"
            description: "Node {{ $labels.instance }} CPU usage is above 80% for 5 minutes."

        
        - alert: HighMemoryUsage
          expr: |
            1 - (
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            ) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage detected"
            description: "Node {{ $labels.instance }} memory usage is above 90% for 5 minutes."