apiVersion: v1
kind: Service
metadata:
  name: devops-api-service
  namespace: {{ .Values.appNamespace }}
spec:
  selector:
    app: {{ .Values.appName }}        # Must perfectly match the deployment template labels
  ports:
    - protocol: TCP
      port: {{ .Values.appPort }}                # The port the service will expose to the cluster/world
      targetPort: {{ .Values.appPort }}       # Must perfectly match the containerPort in your deployment
  type: ClusterIP           # NodePort makes it accessible on your machine's local IP address
