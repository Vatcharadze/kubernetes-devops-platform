apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-api-ingress
  namespace: {{ .Values.appNamespace }}   # Change if your app is in another namespace
spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.appDomain }} # Or your domain name
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-api-service
                port:
                  number: {{ .Values.appPort }}
