name: CI pipeline for python application

permissions:
  contents: write

on:
  push:
    branches: [ "master" ]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/**'

  workflow_dispatch:

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and Run Pytest
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          PYTHONPATH=. pytest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops-api:latest
            ${{ secrets.DOCKER_USERNAME }}/devops-api:${{ github.sha }}

      - name: Update Helm values.yaml
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Install yq
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

          # Update image tag
          yq -i '.imageTag = strenv(IMAGE_TAG)' helm/devops-api/values.yaml

          # Commit and push changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/devops-api/values.yaml
          git commit -m "chore: update image tag to ${IMAGE_TAG}"
          git push